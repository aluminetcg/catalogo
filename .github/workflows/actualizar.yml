# Actualiza el catálogo: baja precios y stock de la tienda, compara con TCGplayer y republica la web.
#  - A mano (pestaña "Actions" -> "Run workflow"): por defecto trae solo los últimos productos subidos (1-2 minutos).
#  - Solo, cada 6 horas: recorre la tienda completa (precios y stock de todo).
name: Actualizar catálogo

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # cada 6 horas: 22:17, 04:17, 10:17 y 16:17 de Argentina
  workflow_dispatch:
    inputs:
      modo:
        description: "ultimos = solo lo recién subido (rápido) · completo = toda la tienda (1 hora) · recalcular = no baja nada"
        type: choice
        options: [ultimos, completo, recalcular]
        default: ultimos
      cantidad:
        description: "Cuántos de los últimos productos subidos revisar (modo ultimos)"
        type: number
        default: 100
  push:
    branches: [main]
    paths: ["index.html", "precios.html", "rarezas.html", "tienda.js", "carga.js", "carga.html", "crawl.py", "precios.py", "singles.py", "data/manual/**", "data/chino/**", "data/marvel/**", "chino.html", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Fecha de hoy
        id: hoy
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/tcgcsv
          key: tcgcsv2-${{ steps.hoy.outputs.d }}
          restore-keys: tcgcsv2-
      - name: Bajar la tienda completa
        if: ${{ github.event_name == 'schedule' || inputs.modo == 'completo' }}
        run: python crawl.py
      - name: Traer solo los últimos productos subidos
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'ultimos' }}
        env:
          CANTIDAD: ${{ inputs.cantidad }}
        run: python crawl.py --recientes "${CANTIDAD:-100}"
      - name: Recalcular rarezas sin recorrer la tienda
        if: ${{ github.event_name == 'push' || inputs.modo == 'recalcular' }}
        run: python crawl.py --reenrich
      - name: Comparar precios con TCGplayer
        env:
          PRECIOS_CLAVE: ${{ secrets.PRECIOS_CLAVE }}
        run: python precios.py
      - name: Guardar datos en el repo (historial + respaldo)
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add data/cards.json
          if [ -f data/precios.bin ]; then git add data/precios.bin; fi
          git diff --cached --quiet || git commit -m "Actualizar catálogo"
          git pull --rebase --autostash
          git push
      - name: Armar sitio
        run: |
          mkdir -p _site/data
          cp index.html precios.html rarezas.html carga.html chino.html tienda.js carga.js factura.js _site/
          cp data/cards.json _site/data/
          if [ -f data/set_icons.json ]; then cp data/set_icons.json _site/data/; fi
          echo "{\"v\": \"$(sha1sum data/cards.json | cut -c1-12)\"}" > _site/data/version.json
          if [ -f data/precios.bin ]; then cp data/precios.bin _site/data/; fi
      - name: Índice para la carga rápida
        run: python singles.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Dar tiempo a que GitHub registre el sitio subido
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de reintentar la publicación
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 90
      - name: Reintentar la publicación
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
